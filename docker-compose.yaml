version: "3.8"
services:

  # SERVICIO 1: Cache y Almacenamiento Clave-Valor (Redis)
  cache-service:
    image: redis:7-alpine
    container_name: compose-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - vol_compose_redis:/data
    command: redis-server --appendonly yes
    networks:
      - red-infraestructura

  # SERVICIO 2: Base de Datos Relacional (PostgreSQL)
  db-service:
    image: postgres:16-alpine
    container_name: compose-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=usuario_uleam
      - POSTGRES_PASSWORD=123456
      - POSTGRES_DB=db_integracion
    ports:
      - "5432:5432"
    volumes:
      - vol_compose_postgres:/var/lib/postgresql/data
    networks:
      - red-infraestructura

# Volumenes para persistencia de datos
volumes:
  vol_compose_redis:
  vol_compose_postgres:

# Red de infraestructura para los servicios
networks:
  red-infraestructura:
    driver: bridge